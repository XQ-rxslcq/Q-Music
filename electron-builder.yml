# electron-builder 配置
# - portable：单文件便携包
# - nsis：可选安装路径的安装包（安装内容 = win-unpacked，不是把应用再压进一个运行时 exe）
# 输出目录由 scripts/dist-win.ps1 设为 dist/<version>/

appId: com.qmusic.app
productName: Q-Music
copyright: Q-Music
directories:
  output: dist/1.2.1
  buildResources: build
files:
  - dist-renderer/**/*
  - dist-electron/**/*
  - package.json
  - assets/icon.png
asar: true
win:
  icon: build/icon.ico
  executableName: Q-Music
  target:
    - target: portable
      arch:
        - x64
    - target: nsis
      arch:
        - x64
portable:
  requestExecutionLevel: user
  artifactName: Q-Music-${version}-portable.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Q-Music
  deleteAppDataOnUninstall: false
  artifactName: Q-Music-${version}-setup.${ext}
extraMetadata:
  main: dist-electron/main.js
  name: Q-Music
  productName: Q-Music
  description: Q-Music player
